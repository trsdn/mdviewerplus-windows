[package]
name = "mdviewerplus-windows"
version = "2.0.0"
description = "MDViewer+ for Windows"
authors = ["Torsten"]
edition = "2021"

[features]
default = ["full"]
lite = []
full = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
base64 = "0.22"
notify = "=8.2.0"
open = "5.3"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
