name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v2.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test-package-release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_TAG
          }
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $tag"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify tag and product versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }
          if ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version -ne $version) {
            throw "Tauri and package versions differ."
          }
          if ((Get-Content src-tauri/Cargo.toml -Raw) -notmatch "version = `"$([regex]::Escape($version))`"") {
            throw "Cargo and package versions differ."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Run dual-edition Node, security, and package tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Lite Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features lite

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build Lite NSIS and MSI installers
        run: npm run build:installer:lite

      - name: Build Full NSIS and MSI installers
        run: npm run build:installer:full

      - name: Verify cross-edition replacement
        shell: pwsh
        run: |
          $liteNsis = (Get-ChildItem "src-tauri/target/lite/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          $fullNsis = (Get-ChildItem "src-tauri/target/full/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          $liteMsi = (Get-ChildItem "src-tauri/target/lite/release/bundle/msi/*.msi" | Select-Object -First 1).FullName
          $fullMsi = (Get-ChildItem "src-tauri/target/full/release/bundle/msi/*.msi" | Select-Object -First 1).FullName
          ./packaging/verify-cross-edition.ps1 `
            -LiteNsis $liteNsis -FullNsis $fullNsis -LiteMsi $liteMsi -FullMsi $fullMsi

      - name: Collect named installers, notices, and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $assets = @{
            "MDViewerPlus-Lite-Windows-x64-Setup.exe" = (Get-ChildItem "src-tauri/target/lite/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
            "MDViewerPlus-Lite-Windows-x64.msi" = (Get-ChildItem "src-tauri/target/lite/release/bundle/msi/*.msi" | Select-Object -First 1).FullName
            "MDViewerPlus-Full-Windows-x64-Setup.exe" = (Get-ChildItem "src-tauri/target/full/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
            "MDViewerPlus-Full-Windows-x64.msi" = (Get-ChildItem "src-tauri/target/full/release/bundle/msi/*.msi" | Select-Object -First 1).FullName
          }
          foreach ($name in $assets.Keys) {
            Copy-Item $assets[$name] (Join-Path artifacts $name)
            $hash = (Get-FileHash (Join-Path artifacts $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              (Join-Path artifacts "$name.sha256"),
              "$hash *$name`n",
              [Text.Encoding]::ASCII
            )
          }
          Copy-Item dist/lite/THIRD-PARTY-NOTICES.md artifacts/THIRD-PARTY-NOTICES-Lite.md
          Copy-Item dist/full/THIRD-PARTY-NOTICES.md artifacts/THIRD-PARTY-NOTICES-Full.md
          Copy-Item packaging/UNSIGNED-INSTALLERS.txt artifacts/UNSIGNED-INSTALLERS.txt

      - name: Audit Lite installer sizes against v2.0.1
        run: |
          node scripts/check-artifact-size.mjs windows-lite-nsis-x64 artifacts/MDViewerPlus-Lite-Windows-x64-Setup.exe
          node scripts/check-artifact-size.mjs windows-lite-msi-x64 artifacts/MDViewerPlus-Lite-Windows-x64.msi

      - name: Generate and validate pending WinGet manifests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $url = "https://github.com/trsdn/mdviewerplus-windows/releases/download/$env:RELEASE_TAG/MDViewerPlus-Full-Windows-x64-Setup.exe"
          node scripts/generate-winget-manifests.mjs `
            --version=$version `
            --installer=artifacts/MDViewerPlus-Full-Windows-x64-Setup.exe `
            --url=$url `
            --output=artifacts/winget/Trsdn.MDViewerPlus/$version
          winget validate --manifest "artifacts/winget/Trsdn.MDViewerPlus/$version"

      - name: Upload release-ready artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdviewerplus-windows-${{ steps.release.outputs.tag }}
          path: artifacts/**
          if-no-files-found: error

      - name: Create release and attach installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --verify-tag `
              --generate-notes `
              --title "MDViewer+ $env:RELEASE_TAG" `
              --notes "Full is the recommended edition. Lite is the minimum-footprint edition. Windows installers are currently unsigned; verify the attached SHA-256 files before installation.`n`nThanks to sdkks/mdviewer (https://github.com/sdkks/mdviewer) and jnscnn/mdviewer-plus-plus (https://github.com/jnscnn/mdviewer-plus-plus) for the implementation input behind several Lite/Full features in this release. See CHANGELOG.md for details."
          }
          $assets = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG $assets --clobber
